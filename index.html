mpting to memorize everything at once.`],debrief:`You rebuilt a pattern from a brief experience. A replay or an association may help you organize it. This small game illustrates attention and recall; it does not reproduce memory distortion or measure your memory ability.`,quiz:{q:`You feel completely certain about a remembered conversation. What follows?`,answers:[`The memory must be accurate.`,`Confidence alone does not establish accuracy.`,`Every part of the memory is false.`],correct:1,why:`The guide distinguishes confidence from accuracy. Check important details against notes or other evidence rather than using certainty as proof.`}},{id:`dreams`,name:`Dreams`,season:1,color:`#bca5ff`,short:`Enter the mind after dark.`,tag:`SLEEP & RECOMBINATION`,title:`Weave a dream from waking life.`,hook:`A strange dream need not be a prediction.`,description:`Combine everyday memory fragments and an emotional tone into an unexpected dream scene.`,topic:`What happens during sleep and REM, why we dream, and whether dreams have meaning.`,rule:`Better sleep → better memory, emotional processing and cognitive performance.`,insights:[`Your sleeping brain remains extremely active.`,`Dreams combine memories, emotions and recent experiences in unusual ways.`,`Dreams should not automatically be interpreted as literal predictions or hidden messages.`,`Sleep contributes to memory processing and emotional regulation.`,`Strange dreams often reflect the brain recombining existing material rather than revealing something supernatural.`,`For better thinking during the day, protect your sleep instead of treating sleep as wasted time.`,`Keeping a notebook beside your bed can improve dream recall.`],debrief:`The scene was assembled from the fragments you chose. It is an invented illustration of recombination—not an interpretation of your dreams and not an explanation of every dream.`,quiz:{q:`What is the most grounded way to treat a vivid, unusual dream?`,answers:[`As a reliable forecast of the future.`,`As proof of a single hidden message.`,`As an experience that may recombine memories and emotions.`],correct:2,why:`The guide emphasizes memories, emotions and recent experiences while cautioning against automatically treating dreams as literal predictions.`}},{id:`anxiety`,name:`Anxiety`,season:1,color:`#ffc39e`,short:`Understand your inner alarm.`,tag:`THREATS & UNCERTAINTY`,title:`Separate the alarm from the evidence.`,hook:`A thought is not automatically a fact.`,description:`Navigate three everyday scenarios. Distinguish predictions from evidence and choose a proportionate next step.`,topic:`Why anxiety exists, how the threat system works, and when useful fear becomes dysfunctional anxiety.`,rule:`Recognize the alarm → separate real danger from imagined danger → act on what you control.`,insights:[`Anxiety originally evolved as a survival mechanism.`,`The problem occurs when your brain’s alarm system reacts to thoughts and uncertainties as though they were immediate physical threats.`,`Avoiding everything that causes anxiety can reinforce the brain’s belief that the situation really is dangerous.`,`Gradual exposure can teach the brain: “I experienced this and survived.”`,`Thoughts are not automatically facts.`,`Chronic uncertainty, social comparison and constant stimulation can amplify anxiety.`,`Instead of endlessly asking “What if something goes wrong?”, ask “What can I actually control right now?”`],debrief:`You checked the evidence before choosing an action. The goal is not to dismiss every alarm: genuine danger calls for safety action. These fictional scenarios are learning exercises, not a treatment plan.`,quiz:{q:`A worried thought appears before an ordinary presentation. Which principle fits this lesson?`,answers:[`Feeling anxious proves that the presentation is dangerous.`,`Never take action until all anxiety disappears.`,`Notice the alarm, check the situation and choose a useful next step.`],correct:2,why:`The guide focuses on distinguishing the alarm from the evidence and acting on what is controllable—not demanding that every uncomfortable feeling disappear.`}},{id:`mindfulness`,name:`Mindfulness`,season:1,color:`#9fd9df`,short:`Practice the art of returning.`,tag:`ATTENTION & AWARENESS`,title:`Notice. Return. Begin again.`,hook:`The return is part of the practice.`,description:`Let thoughts appear, notice one, and gently return to an anchor. There is no speed target and no perfect score.`,topic:`Meditation, attention and the effects of mindfulness on the mind and body.`,rule:`You cannot completely control which thoughts appear—but you can train where your attention goes next.`,insights:[`Mindfulness is not the elimination of thoughts.`,`It means noticing where attention has gone and deliberately returning it.`,`Every time your mind wanders and you bring it back, that return is part of the training.`,`You can observe thoughts without automatically obeying them.`,`Emotions can be noticed as temporary mental events rather than permanent realities.`,`Regular practice matters more than occasional long sessions.`,`Even ordinary activities—walking, eating, breathing—can become attention training.`],extra:`Simple practice: focus on your breathing → notice your mind wandering → do not judge yourself → return attention to breathing → repeat.`,debrief:`Thoughts were allowed to appear. You practiced noticing and returning rather than trying to force your mind empty. A screen exercise is only an illustration; carry the same gentle return into an ordinary activity.`,quiz:{q:`Your mind wandered during attention practice. What counts as the next useful move?`,answers:[`Notice it without judgment and return.`,`Decide that the session has failed.`,`Try never to have another thought.`],correct:0,why:`According to the guide, noticing the wandering and deliberately returning is part of the training, not evidence of failure.`}},{id:`psychedelics`,name:`Psychedelics`,season:1,color:`#dfa9ea`,short:`Question the lens of perception.`,tag:`PERCEPTION & CONTEXT`,title:`Change the lens, not the object.`,hook:`An experience is not reality in its entirety.`,description:`Inspect one geometric object through three visual lenses, then separate an experience from a conclusion.`,topic:`How psychedelic substances affect the brain, their history, and research into possible therapeutic applications.`,rule:`Your current way of perceiving reality is a model produced by your brain—not reality in its entirety.`,insights:[`The ordinary sense of self is partly a construction created by brain networks.`,`Altering those networks can dramatically alter perception, identity and meaning.`,`Psychedelic research suggests that unusually flexible brain states may sometimes help people reconsider entrenched thought patterns.`,`Context matters enormously: expectations, environment and psychological condition affect experiences.`,`Medical research involving psychedelics should not be confused with unsupervised recreational use.`,`A broader lesson applies without substances: entrenched mental models can change.`],debrief:`The geometry stayed the same while its presentation changed. This is a visual metaphor for perspective, not a psychedelic simulation, a brain model, or evidence of therapeutic benefit. The research discussion comes from the supplied guide and is not a current medical review.`,quiz:{q:`Which distinction is essential in this chapter?`,answers:[`An intense experience guarantees objective truth.`,`Research in a controlled setting is not the same as unsupervised use.`,`A possible benefit means there are no risks.`],correct:1,why:`The supplied guide explicitly distinguishes medical research from unsupervised recreational use. This activity offers no instructions for using substances.`}},{id:`focus`,name:`How to Focus`,season:2,color:`#a9c8ff`,short:`Make space for one thing.`,tag:`SIGNAL & DISTRACTION`,title:`Design your environment for attention.`,hook:`Remove a distraction before you have to resist it.`,description:`Set up a workspace, then follow one target through a field of distractions. Change the setup and replay.`,topic:`Attention, distraction and why maintaining concentration is difficult.`,rule:`Do not continuously fight distraction. Remove the sources of distraction before beginning.`,insights:[`Attention is limited. You cannot consciously process everything.`,`The brain naturally switches between focused attention and spontaneous thought.`,`Constant interruption trains you to expect more interruption.`,`Multitasking usually means rapid task-switching, and switching has cognitive costs.`,`Notifications, tabs, messages and phones create external opportunities for attention to escape.`,`Trying harder is not always the solution; designing your environment is often more effective.`,`Break difficult work into clearly defined targets.`,`Rest and mind-wandering are not necessarily enemies of productivity; they can help reset attention.`],extra:`One task → one screen → one goal → no notifications → defined time block. Example: “For the next 60 minutes, my only objective is to finish Feature X.” Anything unrelated waits.`,debrief:`The workspace controls deliberately changed the amount of visual noise in this game. That is a scripted illustration, not a measurement of your attention or proof of a numerical productivity gain. The transferable idea is to make the target clear and remove avoidable interruptions.`,quiz:{q:`Before a focused work block, which action best fits the supplied guide?`,answers:[`Keep every message channel open and just try harder.`,`Switch tasks whenever the current one becomes difficult.`,`Define one outcome and remove avoidable distractions.`],correct:2,why:`The practical system is one task, one screen, one goal, no notifications and a defined time block.`}},{id:`teenage`,name:`Teenage Brain`,season:2,color:`#f5c783`,short:`See development in context.`,tag:`EXPLORATION & SUPPORT`,title:`Build a safer path to exploration.`,hook:`A teenager is not simply a defective adult.`,description:`Reframe three choices using context, support and room to explore—without shaming or stereotyping.`,topic:`Why adolescent brains behave differently and how brain development affects risk, emotion and social behavior.`,rule:`Manage the environment → manage behavior.`,insights:[`Teenage behavior is not explained simply by hormones.`,`Different brain systems mature at different rates.`,`Reward, emotion and social acceptance can strongly influence adolescent decisions.`,`Exploration and risk-taking also have evolutionary advantages: they help young people leave familiar environments and discover independence.`,`Experience during adolescence can powerfully shape developing neural systems.`,`Adults should not treat teenagers simply as defective adults.`],extra:`Broader lesson: behavior is partly determined by the state and development of the brain, not merely by conscious reasoning.`,debrief:`You changed the conditions around a choice while preserving opportunities to learn. The scenes are fictional. The three visual pillars are a metaphor—not measurements, age cutoffs, or a prediction of an individual teenager’s behavior.`,quiz:{q:`Which response preserves the chapter’s central idea?`,answers:[`All teenagers make the same choices.`,`Support safer exploration and consider the social context.`,`Explain every adolescent decision only through hormones.`],correct:1,why:`The guide describes development, reward, social acceptance and experience. It also emphasizes the value of exploration rather than treating adolescents as defective adults.`}},{id:`personality`,name:`Personality`,season:2,color:`#a5d4bd`,short:`Traits are not your destiny.`,tag:`TENDENCIES & CHANGE`,title:`Design a character, not a label.`,hook:`A tendency is not a life sentence.`,description:`Explore five trait dimensions with a fictional character, then choose one small behavioral experiment.`,topic:`Personality traits, personality testing and how personalities change through life.`,rule:`Personality describes tendencies; it does not dictate your future.`,insights:[`People do not fit perfectly into simple boxes such as “introvert” or “extrovert.”`,`Personality is better understood as dimensions or traits.`,`The Big Five framework considers openness, conscientiousness, extraversion, agreeableness and neuroticism.`,`Personality has biological influences but is not completely fixed.`,`Life events, habits, environments and deliberate behavior can gradually change characteristics.`,`Avoid allowing a personality label to become a limitation: “That is simply who I am.”`,`A better approach is: “This is my current behavioral tendency.”`],debrief:`The sliders described a fictional character; they did not test or diagnose you. There is no winning profile. The practical move is to replace a fixed label with a specific tendency and a small behavior to try.`,quiz:{q:`Which sentence leaves room for change?`,answers:[`This is my current tendency; I can practice a different behavior.`,`My personality label determines everything I can do.`,`One quiz defines my identity permanently.`],correct:0,why:`The supplied guide explicitly replaces “That is simply who I am” with “This is my current behavioral tendency.”`}},{id:`creativity`,name:`Creativity`,season:2,color:`#e7b7f4`,short:`Connect what does not yet connect.`,tag:`IDEAS & RECOMBINATION`,title:`Turn unlikely connections into an idea.`,hook:`Generate freely. Evaluate later.`,description:`Combine two ingredients, work within a constraint, and develop three possibilities before selecting one.`,topic:`How the brain creates new ideas and how creativity can be developed.`,rule:`Do not wait for inspiration. Create conditions in which ideas are likely to emerge.`,insights:[`Creativity usually comes from recombining existing ideas, not creating something from nothing.`,`You need two different modes: generate freely and evaluate critically.`,`Trying to judge ideas while generating them can kill potentially useful ideas too early.`,`Diverse experiences give your brain more material to recombine.`,`Periods of relaxation and mind-wandering can help generate connections.`,`Constraints can sometimes increase creativity because they force unusual solutions.`,`Quantity matters: generate many possibilities before selecting one.`],extra:`Input → wander → generate → combine → select → build. Example from the guide: 20 ideas → choose 5 → combine 2 → prototype 1. This short lab uses three ideas as a smaller illustration.`,debrief:`You separated generation from selection and used existing ingredients to create possibilities. The starter examples, when used, were built-in prompts—not an AI service. The next useful step is a small prototype, not waiting for the perfect idea.`,quiz:{q:`Why separate idea generation from evaluation?`,answers:[`So that no idea ever needs to be tested.`,`Because the first idea must always be the best.`,`To avoid rejecting possibilities before they can develop.`],correct:2,why:`The guide warns that judging ideas while generating them can eliminate useful possibilities too early.`}},{id:`brainwashing`,name:`Brainwashing`,season:2,color:`#b8b6f8`,short:`Follow the evidence, not the echo.`,tag:`BELIEFS & INFLUENCE`,title:`Trace a claim back to its source.`,hook:`Three reposts are not three independent sources.`,description:`Investigate a fictional claim across three posts. Uncover its origin and decide what would actually support it.`,topic:`How beliefs can be manipulated and how people become convinced of ideas that outsiders may consider irrational.`,rule:`Do not only question opposing beliefs. Regularly challenge your own.`,insights:[`Human beliefs are strongly affected by social groups, repetition, authority and identity.`,`Intelligence alone does not immunize someone against manipulation.`,`Repeated information can begin to feel more believable simply because it becomes familiar.`,`Communities can reinforce beliefs by continuously providing confi .`,1:`One dream does not prove a single hidden meaning; the guide warns against automatic hidden-message readings.`},actions:[`I will protect a consistent sleep window this week.`,`I will keep a notebook by my bed and jot down dreams when I wake.`,`When a dream feels strange, I will ask which recent experiences it might be remixing — without treating it as a prediction.`]},anxiety:{env:`The Alarm Observatory`,envShort:`Three situation bays around a central alarm beacon.`,objective:`In each of three bays, read the worried prediction, examine every evidence object, then choose a proportionate response at the console and carry it out. One bay contains a genuine hazard. You can leave at any time through the exit arch.`,metaphor:`The bays are fictional situations. The beacon is a metaphor for an inner alarm.`,safety:`This is not treatment, an exposure programme, or a distress test. Nothing is scored. Leave whenever you like.`,debrief:`In each bay you separated the alarm (the worried prediction) from the evidence you could inspect, then chose an action that fit the evidence. In the smoke bay the evidence pointed to a real hazard, so the proportionate action was a safety action: separating alarm from evidence does not mean ignoring alarms. These fictional scenarios are learning exercises, not a treatment plan.`,wrong:{0:`A feeling is information from your alarm system, not proof of danger. Check the evidence.`,1:`Waiting for zero anxiety can mean never acting. The guide focuses on what you can control now.`},actions:[`When an alarm thought appears, I will write the prediction and the evidence in two columns.`,`I will ask, “What can I actually control right now?” and do one small thing.`,`If there is a real hazard, I will act on safety first.`]},mindfulness:{env:`The Attention Garden`,envShort:`A quiet garden with a pond, a floating lantern and a singing bowl.`,objective:`Choose an anchor, sit by the pond, and practise five notice-and-return cycles at your own pace: notice rain model, or evidence of any therapeutic benefit.`,wrong:{0:`Intensity is not evidence of truth; the guide calls perception a model produced by the brain.`,2:`Possible benefits in research do not remove risks. The guide separates research from unsupervised use.`},actions:[`When I feel certain about how something looks, I will ask what another viewpoint would show.`,`I will notice how context — place, mood, expectations — colours one experience today.`,`I will question one entrenched assumption by seeking a different perspective.`]},focus:{env:`The Focus Studio`,envShort:`A workspace with a phone, wall displays, an objective board and a parts tray.`,objective:`Assemble a six-part device in blueprint order while distractions run. Then adjust the workspace yourself — silence the phone, close the displays, define one task, remove clutter — and run a comparable second round. Inspect the comparison.`,metaphor:`The studio is a simplified, scripted workspace. Results are real measurements from this session only.`,debrief:`You assembled six parts twice: first with notifications, tickers, a rotating task board and clutter; then after switching those sources off yourself. The comparison shows what was measured in this session — whichever way it went. The guide’s idea is to design the environment and define one outcome instead of fighting distraction. This was one illustrative comparison, not a controlled productivity experiment.`,wrong:{0:`The guide suggests trying harder is not always the answer; design the environment instead.`,1:`Switching has costs; the guide recommends one clearly defined target.`},actions:[`Before my next work block, I will silence notifications and close unrelated tabs.`,`I will write one specific outcome for the next 60 minutes.`,`I will remove one object that pulls my attention from my workspace.`]},teenage:{env:`The Decision Bridges`,envShort:`Three decision islands linked by bridges over a canyon.`,objective:`At each of three islands, read a fictional choice. Change the route’s conditions — add guidance, a safer alternative or supportive company — and watch the bridge change. Then cross to see an authored example outcome.`,metaphor:`Bridges and islands are metaphors for choices in context. Characters and outcomes are invented.`,safety:`No age cutoffs, no “brain age”, no stereotypes: individuals differ.`,debrief:`At each island you changed the conditions around a choice — guidance, a safer alternative, supportive company — and the route and outcome changed with them, while the exploration itself stayed possible. That reflects the guide’s rule: manage the environment, manage behaviour. The characters and outcomes are authored examples, not predictions about real people.`,wrong:{0:`Individuals differ; the guide does not describe all teenagers as the same.`,2:`The guide says teenage behaviour is not explained simply by hormones.`},actions:[`When I discuss a risky choice with a young person, I will ask what support would make exploring safer.`,`I will suggest a safer alternative that keeps the fun, rather than a flat no.`,`I will remember that context and company shape choices — including my own.`]},personality:{env:`The Trait Atelier`,envShort:`Five trait looms, a character plinth and two situation stages.`,objective:`Set five trait looms to describe a fictional character, save the profile, and step onto the two situation stages to see example responses. Save a second, different profile and compare. Finally choose one small behavioural experiment.`,metaphor:`The character is fictional. The looms are illustration controls, not a test.`,safety:`There is no ideal profile and nothing to maximise. This is not a personality assessment of you.`,debrief:`The looms described a fictional character, not you. Different profiles produced different example responses in the same situations, but none was “right”, and nothing rewarded high or low values. The guide’s move is to replace a fixed label with a current tendency — and ,metaphor:`All posts, products, people and places are invented and neutral.`,debrief:`In Case A, the reposts all traced back to one sponsored advert and the extra “source” repeated it — so the claim stayed unsupported, though not disproved. In Case B, the reposts also shared one origin, but an independent measurement backed the claim. Repetition is not independent confirmation, and lack of support is not automatic disproof.`,wrong:{0:`A shared origin means they are not independent; it is one source repeated.`,2:`Lack of independent support is not disproof.`},actions:[`Before sharing a claim, I will trace it back to its original source.`,`I will ask whether sources are independent or repeating one origin.`,`I will name what evidence would change my mind about one belief I hold.`]}}),Of=`Educational content adapts the ten-topic guide supplied for this project (inspired by The Mind, Explained, Seasons 1–2). It is not an episode transcript, and not every practical tip should be read as a quotation from the documentary. Independent project: not affiliated with, sponsored by, or endorsed by Netflix or Vox.`,kf=`CORTEX is an educational game. It is not a diagnosis, treatment, personality test, intelligence test, or validated cognitive assessment.`,Af=Object.freeze({memory:[{claim:`Every time you remember something, your brain can slightly modify it.`,note:`Reasonable summary of reconstructive memory, but the size and conditions of such changes vary. Keep the hedge "can slightly".`}],dreams:[{claim:`Better sleep → better memory, emotional processing and cognitive performance.`,note:`Simplified causal arrow. Presented as a practical rule, not a measured guarantee for every person.`},{claim:`Dreams combine memories, emotions and recent experiences in unusual ways.`,note:`One prominent view among several theories of dreaming; the game presents it as an illustration, not a complete theory.`}],anxiety:[{claim:`Gradual exposure can teach the brain: "I experienced this and survive
